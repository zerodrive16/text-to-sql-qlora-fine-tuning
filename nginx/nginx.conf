http {
    include      mime.types;
    
    # Removes SPOF if setup as load balancer 
    upstream servers {
        server 127.0.0.1:8001; 
        server 127.0.0.1:8002; 
    }

    server {
        listen 8000; 

        location / {
            proxy_pass http://servers; # round robin algorithmn for load balancing
        }
    }
}